<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121820">
    <title>Collect Cubes</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <canvas id="application-canvas"></canvas>

    <div id="app-error" class="error-banner" hidden></div>

    <div id="app-menu" class="overlay">
        <div class="panel">
            <h1>Collect Cubes</h1>
            <p id="user-label">Conectando...</p>
            <p id="online-label" class="muted">0 online</p>

            <div class="actions">
                <button id="btn-play" class="primary">Jogar</button>
                <button id="btn-google">Entrar com Google</button>
                <button id="btn-guest">Jogar como convidado</button>
                <button id="btn-logout" hidden>Sair</button>
            </div>

            <section class="leaderboard">
                <h2>Ranking — Fase 1</h2>
                <ol id="leaderboard-list"></ol>
            </section>
        </div>
    </div>

    <button id="btn-back-menu" class="back-button" hidden>Menu</button>

    <script type="importmap">
        {
            "imports": {
                "playcanvas": "./lib/playcanvas.mjs"
            }
        }
    </script>
    <script type="module" src="./js/bootstrap.mjs"></script>
</body>
</html>
